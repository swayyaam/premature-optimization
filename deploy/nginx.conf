# nginx in front of several copies of the application.
#
# Run it from the repository root, with a working directory it can write to:
#
#   mkdir -p run/logs
#   nginx -p "$PWD/run" -c "$PWD/deploy/nginx.conf"
#
# Paths below are relative to that -p directory.

worker_processes auto;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # $upstream_addr is which instance served the request. Swapping the two
    # access_log lines below records it, which is how to check that the load
    # spread. It is off by default because writing a line per request is real
    # work, and at forty thousand requests a second a load test with logging on
    # partly measures the logging.
    log_format upstreams '$status $request_uri -> $upstream_addr';
    access_log off;
    # access_log logs/access.log upstreams;

    # The three application instances. nginx sends requests to them in turn.
    upstream shortener {
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
        server 127.0.0.1:8083;

        # Hold connections to the instances open and reuse them, rather than
        # opening a new one for every request.
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://shortener;

            # Both lines are needed for the keepalive above to do anything.
            # HTTP/1.0, which is the default here, has no persistent
            # connections, and the Connection header has to be cleared so it is
            # not passed through to the instance.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Without this the instance sees nginx's upstream name as the host
            # and builds short_url from it. $http_host is the Host header
            # exactly as the client sent it, including the port. $host drops
            # the port, which produces a short_url that does not work.
            proxy_set_header Host $http_host;
        }
    }
}
